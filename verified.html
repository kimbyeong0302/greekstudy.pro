<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이메일 인증 완료 — 헬라어 단어 시험</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0; font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  background: #f4f1ea; color: #222; min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
}
.card {
  max-width: 400px; width: 100%; margin: 24px;
  background: #fff; border-radius: 20px; padding: 40px 32px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.08); text-align: center;
}
.icon { font-size: 52px; margin-bottom: 16px; }
h1 { font-size: 22px; font-weight: 700; margin: 0 0 12px; }
p { font-size: 15px; color: #666; line-height: 1.7; margin: 0 0 28px; }
a.btn {
  display: inline-block; padding: 14px 36px;
  background: #2e6ed6; color: #fff; text-decoration: none;
  border-radius: 12px; font-size: 15px; font-weight: 700;
}
a.btn:active { opacity: 0.85; }
.sub { margin-top: 16px; font-size: 13px; color: #aaa; }
</style>
</head>
<body>
<div class="card">
  <div class="icon">✅</div>
  <h1>가입이 완료되었습니다!</h1>
  <p>이메일 인증이 성공적으로 완료되었습니다.<br>아래 버튼을 눌러 로그인해주세요.</p>
  <a class="btn" href="index.html">로그인하러 가기</a>
  <p class="sub">토블.kr — 헬라어 단어 시험</p>
</div>
</body>
</html>
