<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>학생 홈</title>
<style>
* { box-sizing: border-box; }
body { margin:0; font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; background:#f4f1ea; color:#222; }
.screen { max-width: 480px; margin: 0 auto; padding: 24px 16px 72px; }
.top { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
h1 { font-size: 20px; margin:0; font-weight:700; }
#logoutBtn { font-size:12px; color:#888; background:none; border:1px solid #ddd; border-radius:8px; padding:6px 10px; cursor:pointer; }
.card { background:#fff; border-radius:16px; padding:18px 20px; margin-bottom:14px; box-shadow:0 1px 4px rgba(0,0,0,0.07); }
.card-title { font-size:11px; font-weight:700; color:#aaa; letter-spacing:0.8px; text-transform:uppercase; margin:0 0 12px; }
.join-row { display:flex; gap:8px; }
.join-row input { flex:1; padding:11px 12px; font-size:15px; border-radius:10px; border:1.5px solid #ddd; }
.join-row button { padding:11px 16px; font-size:14px; font-weight:700; border-radius:10px; border:none; background:#2e6ed6; color:#fff; cursor:pointer; }
.group-chip { display:inline-block; padding:6px 12px; border-radius:20px; background:#f0ede6; font-size:13px; margin:0 6px 6px 0; }
.exam-item { border:1.5px solid #eee; border-radius:12px; padding:14px 16px; margin-bottom:10px; }
.exam-item .g-name { font-size:12px; color:#2e6ed6; font-weight:700; margin-bottom:4px; }
.exam-item .desc { font-size:13px; color:#666; margin-bottom:10px; }
.exam-item button { width:100%; padding:10px; font-size:14px; font-weight:700; border-radius:10px; border:none; background:#2e6ed6; color:#fff; cursor:pointer; }
.exam-item button.done { background:#e6f6ea; color:#2e9e4f; cursor:default; }
.empty { color:#999; font-size:13px; text-align:center; padding:12px 0; }
.err { color:#d64545; font-size:13px; margin-top:8px; display:none; }
.chk-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px; }
.chk-row label { font-size:13px; background:#f0ede6; padding:6px 10px; border-radius:8px; cursor:pointer; }
.lv-row { display:flex; gap:6px; margin-bottom:10px; }
.lv-row button { flex:1; padding:8px 4px; font-size:12px; border-radius:8px; border:1.5px solid #ddd; background:#fff; cursor:pointer; }
.lv-row button.active { border-color:#2e6ed6; background:#eaf1fd; color:#2e6ed6; font-weight:700; }
.wide-btn { width:100%; padding:11px; font-size:14px; font-weight:700; border-radius:10px; border:none; background:#2e6ed6; color:#fff; cursor:pointer; }
</style>
</head>
<body>
<div class="screen">
  <div class="top">
    <h1>학생 홈</h1>
    <div style="display:flex;gap:8px;align-items:center;">
      <button id="pwIconBtn" title="비밀번호 변경" style="font-size:16px;background:none;border:1px solid #ddd;border-radius:8px;padding:5px 8px;cursor:pointer;">🔒</button>
      <button id="logoutBtn">로그아웃</button>
    </div>
  </div>

  <div class="card">
    <div class="card-title">그룹 코드로 가입</div>
    <div class="join-row">
      <input type="text" id="codeInput" placeholder="예: AB12CD">
      <button id="joinBtn">가입</button>
    </div>
    <div class="err" id="joinErr"></div>
  </div>

  <div class="card">
    <div class="card-title">공지사항</div>
    <div id="noticeList" class="empty">불러오는 중...</div>
  </div>

  <div class="card">
    <div class="card-title">내 그룹</div>
    <div id="groupList" class="empty">불러오는 중...</div>
  </div>

  <div class="card">
    <div class="card-title">응시 가능한 시험</div>
    <div id="examList" class="empty">불러오는 중...</div>
  </div>

  <div class="card">
    <div class="card-title">자율 연습</div>
    <div id="practiceWeekChks" class="chk-row"><span style="color:#999;font-size:13px;">불러오는 중...</span></div>
    <div class="lv-row" id="practiceLvRow">
      <button class="active" data-lv="1">1단계</button>
      <button data-lv="2">2단계</button>
      <button data-lv="3">3단계</button>
    </div>
    <button class="wide-btn" id="startPracticeBtn">연습 시작</button>
  </div>
</div>

<!-- 비밀번호 변경 모달 -->
<div id="pwModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:1000;align-items:center;justify-content:center;">
  <div style="background:#fff;border-radius:16px;padding:24px;width:min(320px,90vw);box-shadow:0 8px 32px rgba(0,0,0,0.18);">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
      <div style="font-size:15px;font-weight:700;">비밀번호 변경</div>
      <button id="pwModalClose" style="font-size:18px;background:none;border:none;cursor:pointer;color:#aaa;line-height:1;">✕</button>
    </div>
    <input type="password" id="newPwInput" placeholder="새 비밀번호 (6자 이상)" style="width:100%;padding:11px 12px;font-size:14px;border-radius:10px;border:1.5px solid #ddd;margin-bottom:8px;box-sizing:border-box;">
    <input type="password" id="newPwConfirm" placeholder="새 비밀번호 확인" style="width:100%;padding:11px 12px;font-size:14px;border-radius:10px;border:1.5px solid #ddd;margin-bottom:12px;box-sizing:border-box;">
    <button id="changePwBtn" style="width:100%;padding:11px;font-size:14px;font-weight:700;border-radius:10px;border:none;background:#2e6ed6;color:#fff;cursor:pointer;">변경하기</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script>
let me = null;
let practiceLevel = 1;

async function init() {
  const session = await Auth.getSession();
  if (!session) { window.location.href = 'index.html'; return; }
  const role = await Auth.getRole(session.user.id);
  if (role !== 'student') { window.location.href = 'index.html'; return; }
  me = session.user;
  await loadGroups();
  await loadExams();
  await loadNotices();
  await loadPracticeWeeks();
}

async function loadPracticeWeeks() {
  const { data } = await sb.from('words').select('week');
  const weeks = [...new Set((data || []).map(w => w.week))].sort((a, b) => a - b);
  const el = document.getElementById('practiceWeekChks');
  if (weeks.length === 0) { el.textContent = '등록된 단어가 없습니다.'; return; }
  el.innerHTML = weeks.map(w => `<label><input type="checkbox" value="${w}" checked> ${w}주차</label>`).join('');
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}

async function loadNotices() {
  const { data: sys } = await Api.systemNotices();
  const { data: memberships } = await sb.from('group_members').select('group_id').eq('student_id', me.id);
  const groupIds = (memberships || []).map(m => m.group_id);
  const { data: grp } = await Api.noticesForGroups(groupIds);
  const all = [...(sys || []), ...(grp || [])].sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
  const el = document.getElementById('noticeList');
  if (all.length === 0) { el.textContent = '등록된 공지사항이 없습니다.'; return; }
  el.innerHTML = all.map(n => `
    <div style="border-bottom:1px solid #eee; padding:10px 0;">
      <div style="font-size:11px; color:#2e6ed6; font-weight:700; margin-bottom:4px;">
        ${n.scope === 'system' ? '전체 공지' : escapeHtml(n.groups ? n.groups.name : '그룹 공지')}
      </div>
      <div style="font-size:14px;">${escapeHtml(n.content)}</div>
      <div style="font-size:11px; color:#999; margin-top:4px;">${new Date(n.created_at).toLocaleString('ko-KR')}</div>
    </div>
  `).join('');
}

async function loadGroups() {
  const { data } = await Api.myGroupsAsStudent(me.id);
  const el = document.getElementById('groupList');
  if (!data || data.length === 0) { el.textContent = '아직 가입한 그룹이 없습니다.'; return; }
  el.innerHTML = data.map(m => `<span class="group-chip">${m.groups.name}</span>`).join('');
}

async function loadExams() {
  const { data } = await Api.activeExamsForStudent(me.id);
  const el = document.getElementById('examList');
  if (!data || data.length === 0) { el.textContent = '지금 응시 가능한 시험이 없습니다.'; return; }
  el.innerHTML = '';
  for (const exam of data) {
    const { data: attempt } = await Api.myAttempt(exam.id, me.id);
    const modeLabel = exam.mode === 'test' ? `테스트 모드 (${exam.time_limit_sec}초)` : '연습 모드';
    const div = document.createElement('div');
    div.className = 'exam-item';
    div.innerHTML = `
      <div class="g-name">${exam.groups ? exam.groups.name : ''}</div>
      <div class="desc">${exam.weeks.join(', ')}주차 단어 · ${exam.level}단계 · ${modeLabel}</div>
      ${attempt
        ? `<button class="done" disabled>응시 완료 (${attempt.score} / ${attempt.total}점)</button>`
        : `<button data-exam="${exam.id}">응시하기</button>`}
    `;
    el.appendChild(div);
  }
  el.querySelectorAll('button[data-exam]').forEach(b => {
    b.addEventListener('click', () => { window.location.href = 'quiz.html?exam=' + b.dataset.exam; });
  });
}

document.getElementById('joinBtn').addEventListener('click', async () => {
  const code = document.getElementById('codeInput').value.trim().toUpperCase();
  const errEl = document.getElementById('joinErr');
  errEl.style.display = 'none';
  if (!code) return;
  const { error } = await Api.joinGroupByCode(code);
  if (error) { errEl.textContent = error.message; errEl.style.display = 'block'; return; }
  document.getElementById('codeInput').value = '';
  await loadGroups();
  await loadExams();
  await loadNotices();
});

document.getElementById('practiceLvRow').addEventListener('click', e => {
  const btn = e.target.closest('button'); if (!btn) return;
  document.querySelectorAll('#practiceLvRow button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active'); practiceLevel = parseInt(btn.dataset.lv);
});

document.getElementById('startPracticeBtn').addEventListener('click', () => {
  const weeks = [...document.querySelectorAll('#practiceWeekChks input:checked')].map(c => c.value);
  if (weeks.length === 0) { alert('주차를 하나 이상 선택하세요.'); return; }
  window.location.href = `quiz.html?practice=1&weeks=${weeks.join(',')}&level=${practiceLevel}`;
});

const pwModal = document.getElementById('pwModal');
document.getElementById('pwIconBtn').addEventListener('click', () => {
  pwModal.style.display = 'flex';
});
document.getElementById('pwModalClose').addEventListener('click', () => {
  pwModal.style.display = 'none';
});
pwModal.addEventListener('click', (e) => {
  if (e.target === pwModal) pwModal.style.display = 'none';
});

document.getElementById('changePwBtn').addEventListener('click', async () => {
  const pw = document.getElementById('newPwInput').value;
  const confirm = document.getElementById('newPwConfirm').value;
  if (pw.length < 6) { alert('비밀번호는 6자 이상이어야 합니다.'); return; }
  if (pw !== confirm) { alert('비밀번호가 일치하지 않습니다.'); return; }
  const { error } = await sb.auth.updateUser({ password: pw });
  if (error) { alert('변경 실패: ' + error.message); return; }
  alert('비밀번호가 변경되었습니다.');
  document.getElementById('newPwInput').value = '';
  document.getElementById('newPwConfirm').value = '';
  pwModal.style.display = 'none';
});

document.getElementById('logoutBtn').addEventListener('click', async () => {
  await Auth.signOut();
  window.location.href = 'index.html';
});

init();
</script>
</body>
</html>
