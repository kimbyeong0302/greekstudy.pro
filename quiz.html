<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>단어 시험</title>
<style>
* { box-sizing: border-box; }
body { margin:0; font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; background:#f4f1ea; color:#222; min-height:100vh; }
.screen { max-width: 480px; margin: 0 auto; padding: 24px 16px 72px; }
h1 { font-size: 20px; text-align:center; margin:0 0 20px; font-weight:700; }
.status { display:flex; justify-content:space-between; align-items:center; font-size:14px; color:#555; margin-bottom:12px; }
#scoreEl { font-weight:600; color:#222; }
#timerEl { font-size:20px; font-weight:800; color:#2e6ed6; width:36px; height:36px; border-radius:50%; border:2.5px solid #2e6ed6; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
#timerEl.urgent { color:#d64545; border-color:#d64545; }
#timerEl:empty { border-color:transparent; }
.word-card { background:#fff; border-radius:16px; padding:28px 16px 24px; text-align:center; box-shadow:0 1px 4px rgba(0,0,0,0.08); margin-bottom:18px; min-height:130px; display:flex; flex-direction:column; align-items:center; justify-content:center; }
#wordDisplay { font-weight:700; font-size:32px; word-break:break-word; }
#subDisplay { font-size:16px; color:#777; margin-top:6px; }
#subDisplay:empty { display:none; }
#hintText { font-size:13px; color:#999; margin-top:10px; }
.choices { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.choices button { padding:13px 8px; font-size:14px; border-radius:10px; border:1.5px solid #ddd; background:#fff; cursor:pointer; }
.choices button.correct { border-color:#2e9e4f; background:#e6f6ea; }
.choices button.wrong { border-color:#d64545; background:#fdecec; }
#feedbackEl { min-height:20px; text-align:center; font-size:14px; margin-top:14px; }
.correct-text { color:#2e9e4f; } .wrong-text { color:#d64545; }
.final { text-align:center; font-size:15px; font-weight:700; margin-top:10px; }
.btn-row { display:flex; justify-content:center; gap:8px; margin-top:18px; }
.btn-row button { padding:10px 16px; font-size:13px; border-radius:10px; border:1.5px solid #ccc; background:#fff; cursor:pointer; }
#wrongList { display:none; margin-top:24px; }
.wl-title { font-size:15px; font-weight:700; margin:0 0 12px; color:#333; }
.wi { background:#fff; border-radius:12px; border:1.5px solid #f0c0c0; padding:14px 16px; margin-bottom:10px; }
.wi-q { font-size:17px; font-weight:700; margin-bottom:8px; }
.wi-row { display:flex; gap:8px; font-size:13px; margin-top:4px; }
.wi-lbl { color:#aaa; } .wi-wrong { color:#d64545; font-weight:600; } .wi-correct { color:#2e9e4f; font-weight:600; }
.all-correct { text-align:center; font-size:15px; color:#2e9e4f; font-weight:700; background:#e6f6ea; border-radius:14px; padding:20px; }
.notice { text-align:center; color:#666; font-size:14px; padding:40px 20px; }
</style>
</head>
<body>
<div class="screen">
  <h1>단어 시험</h1>
  <div id="noticeEl" class="notice">불러오는 중...</div>

  <div id="quizWrap" style="display:none">
    <div class="status">
      <span id="progressEl"></span>
      <span id="timerEl"></span>
      <span id="scoreEl"></span>
    </div>
    <div class="word-card">
      <div id="wordDisplay"></div>
      <div id="subDisplay"></div>
      <div id="hintText"></div>
    </div>
    <div class="choices" id="choicesEl"></div>
    <div id="feedbackEl"></div>
    <div class="btn-row">
      <button id="backBtn">← 학생 홈으로</button>
      <button id="retryBtn" style="display:none">다시 연습하기</button>
    </div>
    <div id="wrongList"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script>
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

let me = null, exam = null, words = [], isPractice = false;
let quizOrder = [], qIdx = 0, score = 0, answered = false, wrongAnswers = [];
let countdownTimer = null, moveTimer = null;

const noticeEl = document.getElementById('noticeEl');
const quizWrap = document.getElementById('quizWrap');
const progressEl = document.getElementById('progressEl');
const timerEl = document.getElementById('timerEl');
const scoreEl = document.getElementById('scoreEl');
const wordDisplay = document.getElementById('wordDisplay');
const subDisplay = document.getElementById('subDisplay');
const hintText = document.getElementById('hintText');
const choicesEl = document.getElementById('choicesEl');
const feedbackEl = document.getElementById('feedbackEl');
const wrongListEl = document.getElementById('wrongList');

async function init() {
  const session = await Auth.getSession();
  if (!session) { window.location.href = 'index.html'; return; }
  const role = await Auth.getRole(session.user.id);
  if (role !== 'student') { window.location.href = 'index.html'; return; }
  me = session.user;

  const params = new URLSearchParams(window.location.search);
  isPractice = params.get('practice') === '1';

  if (isPractice) {
    // 자율 연습 모드: 특정 시험(exam)에 묶이지 않고, 학생이 직접 고른 주차/단계로
    // 언제든 다시 연습할 수 있습니다. 점수는 저장되지 않고 응시 제한도 없습니다.
    const weeks = (params.get('weeks') || '').split(',').map(n => parseInt(n)).filter(n => !isNaN(n));
    const level = parseInt(params.get('level')) || 1;
    if (weeks.length === 0) { noticeEl.textContent = '연습할 주차를 선택해주세요.'; return; }
    exam = { id: null, weeks, level, mode: 'practice', time_limit_sec: 0 };
    document.querySelector('h1').textContent = '단어 연습';
  } else {
    const examId = params.get('exam');
    if (!examId) { noticeEl.textContent = '잘못된 접근입니다.'; return; }

    const { data: existing } = await Api.myAttempt(examId, me.id);
    if (existing) { noticeEl.textContent = `이미 응시한 시험입니다. (${existing.score} / ${existing.total}점)`; return; }

    const { data: examData, error: examErr } = await sb.from('exams').select('*').eq('id', examId).maybeSingle();
    if (examErr || !examData) { noticeEl.textContent = '응시할 수 없는 시험입니다.'; return; }
    exam = examData;
  }

  // words 테이블을 매번 새로 조회하므로, 이후 주차/단어를 추가하면 바로 반영됩니다.
  const { data: wordData } = await Api.wordsForWeeks(exam.weeks);
  words = wordData || [];
  if (words.length === 0) { noticeEl.textContent = '해당 주차에 등록된 단어가 없습니다.'; return; }

  noticeEl.style.display = 'none';
  quizWrap.style.display = 'block';
  launchQuiz();
}

function launchQuiz() {
  document.getElementById('retryBtn').style.display = 'none';
  quizOrder = shuffle(words.map(w => ({ data: w })));
  qIdx = 0; score = 0; answered = false; wrongAnswers = [];
  renderQuestion();
}

function stopTimers() {
  if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }
  if (moveTimer) { clearTimeout(moveTimer); moveTimer = null; }
  timerEl.textContent = ''; timerEl.classList.remove('urgent');
}

function renderQuestion() {
  stopTimers(); answered = false; feedbackEl.innerHTML = '';
  wrongListEl.style.display = 'none'; wrongListEl.innerHTML = '';
  const q = quizOrder[qIdx];
  progressEl.textContent = '문제 ' + (qIdx + 1) + ' / ' + quizOrder.length;
  scoreEl.textContent = '맞은 개수: ' + score;
  const w = q.data, lv = exam.level;
  if (lv === 3) {
    wordDisplay.style.fontSize = '22px';
    wordDisplay.textContent = w.ko || w.en;
    subDisplay.textContent = '';
    hintText.textContent = '이 뜻에 해당하는 헬라어 단어는?';
  } else {
    wordDisplay.style.fontSize = '32px';
    wordDisplay.textContent = w.gr;
    subDisplay.textContent = (lv === 1 && w.kr) ? '[' + w.kr + ']' : '';
    hintText.textContent = '이 단어의 뜻은?';
  }
  const matchKey = lv === 3 ? 'gr' : 'en';
  const pool = shuffle(words.filter(x => x[matchKey] !== w[matchKey])).slice(0, 3);
  pool.push(w);
  buildChoices(shuffle(pool), opt => opt[matchKey], w[matchKey], q);
}

function buildChoices(opts, getValue, correctVal, q) {
  choicesEl.innerHTML = '';
  opts.forEach(opt => {
    const val = getValue(opt);
    const btn = document.createElement('button');
    btn.textContent = val;
    btn.addEventListener('click', () => {
      if (answered) return;
      answered = true;
      if (exam.mode === 'test') { stopTimers(); }
      if (val === correctVal) {
        score++; btn.classList.add('correct');
        feedbackEl.innerHTML = '<span class="correct-text">정답입니다.</span>';
      } else {
        btn.classList.add('wrong');
        wrongAnswers.push({ q, chosen: val, correct: correctVal });
        feedbackEl.innerHTML = '<span class="wrong-text">오답입니다. 정답: ' + correctVal + '</span>';
      }
      scoreEl.textContent = '맞은 개수: ' + score;
      Array.from(choicesEl.children).forEach(c => { if (c.textContent === correctVal && c !== btn) c.classList.add('correct'); });
      scheduleNext();
    });
    choicesEl.appendChild(btn);
  });
  if (exam.mode === 'test') startQuestionTimer(correctVal, q);
}

function startQuestionTimer(correctVal, q) {
  let count = exam.time_limit_sec || 3;
  timerEl.textContent = count; timerEl.classList.remove('urgent');
  countdownTimer = setInterval(() => {
    count--;
    if (count > 0) {
      timerEl.textContent = count;
      if (count === 1) timerEl.classList.add('urgent');
    } else {
      clearInterval(countdownTimer); countdownTimer = null;
      if (answered) return;
      answered = true;
      wrongAnswers.push({ q, chosen: '(시간 초과)', correct: correctVal });
      Array.from(choicesEl.children).forEach(c => { if (c.textContent === correctVal) c.classList.add('correct'); });
      feedbackEl.innerHTML = '<span class="wrong-text">시간 초과! 정답: ' + correctVal + '</span>';
      timerEl.textContent = ''; timerEl.classList.remove('urgent');
      scheduleNext();
    }
  }, 1000);
}

function scheduleNext() {
  moveTimer = setTimeout(() => { moveTimer = null; advanceOrEnd(); }, 1000);
}

async function advanceOrEnd() {
  if (qIdx < quizOrder.length - 1) { qIdx++; renderQuestion(); return; }
  const label = isPractice ? '연습 종료! 최종 점수: ' : '시험 종료! 최종 점수: ';
  feedbackEl.innerHTML += '<div class="final">' + label + score + ' / ' + quizOrder.length + '</div>';
  showWrongList();
  if (exam.id) {
    // 시험 모드: 응시 기록을 저장합니다 (1회 제한).
    const { error: submitErr } = await Api.submitAttempt(exam.id, me.id, score, quizOrder.length, wrongAnswers.map(w => ({
      word: w.q.data.gr, chosen: w.chosen, correct: w.correct
    })));
    if (submitErr) {
      feedbackEl.innerHTML += `<div style="color:#d64545;font-size:13px;margin-top:8px;">⚠️ 결과 저장 실패: ${submitErr.message}</div>`;
    }
  } else {
    // 자율 연습 모드: 기록을 남기지 않고, 원하면 바로 다시 연습할 수 있습니다.
    document.getElementById('retryBtn').style.display = 'inline-block';
  }
}

function showWrongList() {
  wrongListEl.style.display = 'block';
  let html = '';
  if (wrongAnswers.length === 0) {
    html = '<p class="all-correct">모두 맞혔습니다! 🎉</p>';
  } else {
    html = '<p class="wl-title">틀린 문제 목록 (' + wrongAnswers.length + '개)</p>';
    wrongAnswers.forEach(({ q, chosen, correct }) => {
      const w = q.data, lv = exam.level;
      const qText = lv === 3 ? (w.ko || w.en) : (w.gr + (w.kr ? ' [' + w.kr + ']' : ''));
      html += '<div class="wi"><div class="wi-q">' + qText + '</div>' +
        '<div class="wi-row"><span class="wi-lbl">내 답 </span><span class="wi-wrong">' + chosen + '</span></div>' +
        '<div class="wi-row"><span class="wi-lbl">정답 </span><span class="wi-correct">' + correct + '</span></div></div>';
    });
  }
  wrongListEl.innerHTML = html;
}

document.getElementById('backBtn').addEventListener('click', () => { window.location.href = 'student.html'; });
document.getElementById('retryBtn').addEventListener('click', launchQuiz);

init();
</script>
</body>
</html>
