<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>관리자 대시보드</title>
<style>
* { box-sizing: border-box; }
body { margin:0; font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; background:#f4f1ea; color:#222; }
.screen { max-width: 640px; margin: 0 auto; padding: 24px 16px 72px; }
.top { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
h1 { font-size: 20px; margin:0; font-weight:700; }
.badge { font-size:11px; background:#d64545; color:#fff; padding:3px 8px; border-radius:20px; margin-left:8px; font-weight:700; }
#logoutBtn { font-size:12px; color:#888; background:none; border:1px solid #ddd; border-radius:8px; padding:6px 10px; cursor:pointer; }
.card { background:#fff; border-radius:16px; padding:18px 20px; margin-bottom:14px; box-shadow:0 1px 4px rgba(0,0,0,0.07); }
.card-title { font-size:11px; font-weight:700; color:#aaa; letter-spacing:0.8px; text-transform:uppercase; margin:0 0 12px; }
.row { display:flex; gap:8px; }
.row input { flex:1; padding:11px 12px; font-size:14px; border-radius:10px; border:1.5px solid #ddd; }
.row button { padding:10px 14px; font-size:13px; font-weight:700; border-radius:10px; border:none; background:#2e6ed6; color:#fff; cursor:pointer; white-space:nowrap; }
.btn-sm { padding:5px 10px; font-size:12px; font-weight:600; border-radius:8px; border:1.5px solid #ddd; background:#fff; cursor:pointer; }
.btn-sm.danger { color:#d64545; border-color:#f0c9c9; }
table { width:100%; border-collapse:collapse; font-size:13px; }
th { text-align:left; padding:6px 8px; border-bottom:2px solid #eee; color:#888; font-size:11px; font-weight:700; letter-spacing:0.5px; }
td { padding:8px 8px; border-bottom:1px solid #f0f0f0; vertical-align:middle; }
.empty { color:#999; font-size:13px; text-align:center; padding:16px 0; }
.msg { font-size:12px; margin-top:8px; display:none; }
.msg.ok { color:#2e9e4f; } .msg.err { color:#d64545; }
.notice-item { display:flex; justify-content:space-between; align-items:flex-start; padding:8px 0; border-bottom:1px solid #f0f0f0; gap:10px; }
.notice-item:last-child { border-bottom:none; }
.notice-content { font-size:14px; flex:1; }
.notice-date { font-size:11px; color:#aaa; margin-top:3px; }
.stat-row { display:flex; gap:10px; margin-bottom:14px; }
.stat { flex:1; background:#fff; border-radius:12px; padding:14px 10px; text-align:center; box-shadow:0 1px 4px rgba(0,0,0,0.07); }
.stat-num { font-size:24px; font-weight:800; color:#2e6ed6; }
.stat-lbl { font-size:11px; color:#888; margin-top:2px; }
</style>
</head>
<body>
<div class="screen">
  <div class="top">
    <h1>관리자 대시보드 <span class="badge">ADMIN</span></h1>
    <button id="logoutBtn">로그아웃</button>
  </div>

  <div class="stat-row">
    <div class="stat"><div class="stat-num" id="statProf">-</div><div class="stat-lbl">교수</div></div>
    <div class="stat"><div class="stat-num" id="statStu">-</div><div class="stat-lbl">학생</div></div>
    <div class="stat"><div class="stat-num" id="statGrp">-</div><div class="stat-lbl">그룹</div></div>
    <div class="stat"><div class="stat-num" id="statExam">-</div><div class="stat-lbl">시험</div></div>
  </div>

  <div class="card">
    <div class="card-title">전체 공지사항</div>
    <div class="row">
      <input type="text" id="noticeInput" placeholder="모든 학생·교수에게 보낼 공지 내용">
      <button onclick="postNotice()">등록</button>
    </div>
    <div class="msg" id="noticeMsg"></div>
    <div id="noticeList" style="margin-top:12px;"></div>
  </div>

  <div class="card">
    <div class="card-title">교수 관리</div>
    <div id="profList" class="empty">불러오는 중...</div>
  </div>

  <div class="card">
    <div class="card-title">학생 관리</div>
    <div id="stuList" class="empty">불러오는 중...</div>
  </div>

  <div class="card">
    <div class="card-title">그룹 현황</div>
    <div id="grpList" class="empty">불러오는 중...</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script>
let me = null;

function escapeHtml(str) {
  return String(str ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function init() {
  const session = await Auth.getSession();
  if (!session) { window.location.href = 'index.html'; return; }
  const role = await Auth.getRole(session.user.id);
  if (role !== 'admin') { window.location.href = 'index.html'; return; }
  me = session.user;
  await Promise.all([loadStats(), loadNotices(), loadProfessors(), loadStudents(), loadGroups()]);
}

async function loadStats() {
  const [p, s, g, e] = await Promise.all([
    Api.adminAllProfessors(),
    Api.adminAllStudents(),
    Api.adminAllGroups(),
    Api.adminAllExamsWithAttemptCount()
  ]);
  document.getElementById('statProf').textContent = (p.data || []).length;
  document.getElementById('statStu').textContent = (s.data || []).length;
  document.getElementById('statGrp').textContent = (g.data || []).length;
  document.getElementById('statExam').textContent = (e.data || []).length;
}

async function loadNotices() {
  const { data } = await Api.systemNotices();
  const el = document.getElementById('noticeList');
  if (!data || data.length === 0) {
    el.innerHTML = '<div class="empty">등록된 전체 공지가 없습니다.</div>'; return;
  }
  el.innerHTML = data.map(n => `
    <div class="notice-item">
      <div style="flex:1">
        <div class="notice-content">${escapeHtml(n.content)}</div>
        <div class="notice-date">${new Date(n.created_at).toLocaleString('ko-KR')}</div>
      </div>
      <button class="btn-sm danger" onclick="deleteNotice('${n.id}')">삭제</button>
    </div>`).join('');
}

async function postNotice() {
  const input = document.getElementById('noticeInput');
  const content = input.value.trim();
  const msgEl = document.getElementById('noticeMsg');
  msgEl.className = 'msg'; msgEl.style.display = 'none';
  if (!content) return;
  const { error } = await Api.createSystemNotice(content);
  if (error) {
    msgEl.textContent = error.message; msgEl.className = 'msg err'; msgEl.style.display = 'block'; return;
  }
  input.value = '';
  msgEl.textContent = '공지가 등록되었습니다.'; msgEl.className = 'msg ok'; msgEl.style.display = 'block';
  await loadNotices();
}

async function deleteNotice(id) {
  if (!confirm('이 공지를 삭제하시겠습니까?')) return;
  await Api.deleteNotice(id);
  await loadNotices();
}

async function loadProfessors() {
  const { data } = await Api.adminAllProfessors();
  const el = document.getElementById('profList');
  if (!data || data.length === 0) { el.innerHTML = '<div class="empty">등록된 교수가 없습니다.</div>'; return; }
  el.innerHTML = `
    <table>
      <tr><th>이름</th><th>이메일</th><th>가입일</th><th></th></tr>
      ${data.map(p => `
        <tr>
          <td><b>${escapeHtml(p.name)}</b></td>
          <td style="color:#555;font-size:12px;">${escapeHtml(p.email)}</td>
          <td style="color:#aaa;font-size:12px;">${new Date(p.created_at).toLocaleDateString('ko-KR')}</td>
          <td><button class="btn-sm" onclick="resetPw('${p.id}','${escapeHtml(p.name)}')">비번 초기화</button></td>
        </tr>`).join('')}
    </table>`;
}

async function loadStudents() {
  const { data } = await Api.adminAllStudents();
  const el = document.getElementById('stuList');
  if (!data || data.length === 0) { el.innerHTML = '<div class="empty">등록된 학생이 없습니다.</div>'; return; }
  el.innerHTML = `
    <table>
      <tr><th>학번</th><th>이름</th><th>가입일</th><th></th></tr>
      ${data.map(s => `
        <tr>
          <td style="font-weight:600;">${escapeHtml(s.student_number)}</td>
          <td>${escapeHtml(s.name)}</td>
          <td style="color:#aaa;font-size:12px;">${new Date(s.created_at).toLocaleDateString('ko-KR')}</td>
          <td><button class="btn-sm" onclick="resetPw('${s.id}','${escapeHtml(s.name)}')">비번 초기화</button></td>
        </tr>`).join('')}
    </table>`;
}

async function loadGroups() {
  const { data } = await Api.adminAllGroups();
  const el = document.getElementById('grpList');
  if (!data || data.length === 0) { el.innerHTML = '<div class="empty">등록된 그룹이 없습니다.</div>'; return; }
  el.innerHTML = `
    <table>
      <tr><th>그룹명</th><th>교수</th><th>가입 코드</th><th>생성일</th></tr>
      ${data.map(g => `
        <tr>
          <td><b>${escapeHtml(g.name)}</b></td>
          <td style="color:#555;font-size:12px;">${escapeHtml(g.professors?.name ?? '-')}</td>
          <td style="color:#2e6ed6;font-weight:700;">${escapeHtml(g.join_code)}</td>
          <td style="color:#aaa;font-size:12px;">${new Date(g.created_at).toLocaleDateString('ko-KR')}</td>
        </tr>`).join('')}
    </table>`;
}

async function resetPw(userId, name) {
  if (!confirm(`"${name}"의 비밀번호를 "0000"으로 초기화하시겠습니까?`)) return;
  try {
    await Api.resetPassword(userId);
    alert(`"${name}"의 비밀번호가 0000으로 초기화되었습니다.`);
  } catch (err) {
    alert('초기화 실패: ' + err.message);
  }
}

document.getElementById('logoutBtn').addEventListener('click', async () => {
  await Auth.signOut();
  window.location.href = 'index.html';
});

init();
</script>
</body>
</html>
